name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Supersede in-flight runs when a branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check Astro
        run: npm run check

      - name: Build production site
        run: npm run build

      - name: Verify generated site contracts
        run: npm run test:site

      # Reachability is a PRODUCTION gate. `dev` is allowed to carry ecosystem
      # destinations that are marked live but whose DNS hasn't been pointed
      # yet; `main` is not. This is what blocks shipping the dead links the
      # August 2026 audit found, without turning dev PRs red in the meantime.
      - name: Verify ecosystem destinations are reachable
        if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        run: npm run test:site -- --check-links

      - name: Audit all dependencies
        run: npm audit --audit-level=high
