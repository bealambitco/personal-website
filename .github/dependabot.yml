version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    ignore:
      # @astrojs/check@0.9.10 (latest) peer-requires typescript ^5 || ^6.
      # A TypeScript 7 bump makes `npm ci` fail with ERESOLVE, which breaks
      # CI for every PR targeting this branch — see PR #11. Remove this
      # ignore once @astrojs/check declares support for TypeScript 7.
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      development-dependencies:
        dependency-type: development
